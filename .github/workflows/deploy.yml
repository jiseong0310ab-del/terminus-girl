name: Test and Deploy Terminus Girl
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble public files
        run: |
          mkdir public
          cp index.html style.css manifest.webmanifest sw.js public/
          cp -R js assets public/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
